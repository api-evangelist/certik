name: CertiK
description: >-
  CertiK is a leading Web3 security platform that combines AI, formal verification,
  and expert audits to secure blockchain protocols and smart contracts. Its Partner
  (Skynet) API exposes CertiK's security intelligence to integrators: the Skynet
  Security Score API returns comprehensive, multi-metric security scores for
  blockchain projects (score, rank, tier, percentile, highlights and alerts), and
  the Token Scan API returns real-time on-chain security analysis of token contracts
  across major chains (token info, market and holder data, a SkyKnight score, and a
  severity-ranked security summary). Access is by partner API key issued by the
  CertiK Business Team, sent in the X-Certik-Api-Key header against
  https://partner.certik-skynet.com. CertiK is a portfolio company of Insight
  Partners, Lightspeed Venture Partners, SoftBank Vision Fund and Wing Venture Capital.
